#
# credits: https://gitlab.com/tkpapp/GitlabJuliaDemo.jl
#

image: julia:latest # image comes from Docker hub

stages:
  - linter
  - test
  - deploy

before_script:
  # workaround for https://github.com/JuliaDocs/Documenter.jl/issues/686
  - apt-get -qq update; apt-get -y install git
  - julia --project=@. -e "import Pkg; Pkg.build()"

format:
  # consider using pre-commit here
  stage: linter
  script:
    - "[[ -d .julia ]] && mv .julia /tmp"
    - julia --project=.formatting -e 'import Pkg; Pkg.add("JuliaFormatter")'
    - julia --project=.formatting .formatting/format_all.jl
    - "[[ -d /tmp/.julia ]] && mv /tmp/.julia ."
  variables:
    CI_JULIA_VERSION: "1.11"
    JULIA_DEPOT_PATH: /tmp/.julia
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

unit_test_cpu:
  stage: test
  variables:
    TEST_AMDGPU: "0"
    TEST_CUDA: "0"
    TEST_METAL: "0"
    TEST_CPU: "1"
    TEST_ONEAPI: "0"
  image: "julia:1.11"
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

unit_test_cuda:
  stage: test
  tags:
    - "cuda"
    - "x86_64"
  interruptible: true
  variables:
    TEST_AMDGPU: "0"
    TEST_CUDA: "1"
    TEST_METAL: "0"
    TEST_CPU: "0"
    TEST_ONEAPI: "0"
  image: "julia:1.11"
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
  coverage: /Test coverage (\d+\.\d+%)/
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

unit_test_amdgpu:
  stage: test
  tags:
    - "rocm"
    - "x86_64"
  interruptible: true
  variables:
    TEST_AMDGPU: "1"
    TEST_CUDA: "0"
    TEST_METAL: "0"
    TEST_CPU: "0"
    TEST_ONEAPI: "0"
  image: "rocm/dev-ubuntu-24.04:6.2.4-complete"
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
  coverage: /Test coverage (\d+\.\d+%)/
  before_script:
    - "curl -fsSL https://install.julialang.org | sh -s -- -y -p /julia"
    - "export PATH=/julia/bin:$PATH"
    - "echo $PATH"
    - "juliaup add 1.11"
    - "juliaup default 1.11"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

unit_test_metal:
  stage: test
  tags:
    - "macos-medium-m1"
  interruptible: true
  variables:
    TEST_AMDGPU: "0"
    TEST_CUDA: "0"
    TEST_METAL: "1"
    TEST_CPU: "0"
    TEST_ONEAPI: "0"
  image: "ghcr.io/cirruslabs/macos-sequoia-xcode:16"
  script:
    - |
      julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage=true)'
  coverage: /Test coverage (\d+\.\d+%)/
  before_script:
    - brew install --cask julia
    - julia --version
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'dev' || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

pages:
  stage: deploy
  script:
    - julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
    - julia --project=docs --color=yes docs/make.jl
    - mv docs/build public # move to the directory picked up by Gitlab pages
  artifacts:
    paths:
      - public
  only:
    - main
